name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MQTT_BROKER_PROD: wss://example.invalid
      NEXT_PUBLIC_MQTT_BROKER_DEV: ws://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package-lock.json predates the current Drizzle tooling version; use
        # package.json as the source of truth until the lockfile is regenerated.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
